[package]
name = "academic-system-desktop"
version = "1.0.0"
description = "College Academic Administration and Course Selection System"
authors = ["Academic Engineering Team"]
edition = "2021"

[lib]
name = "academic_system_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

