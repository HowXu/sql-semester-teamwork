# Lefthook Git 钩子配置
commit-msg:
  commands:
    "chinese-conventional-and-three-points":
      run: node scripts/verify-commit.js {1}

pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: node scripts/check-gitleaks.js
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
